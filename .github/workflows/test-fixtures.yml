name: Validate test layout and executable fixtures

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  validate-test-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/validate_test_layout.py
      - run: python tests/insecure-fixtures/secod-failure-safety/run_fixtures.py
